name: 🪟 Windows Build

on:
  workflow_call:

jobs:
  windows-loader:
    name: "Build"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download version.h artifact
      uses: actions/download-artifact@v4
      with:
        name: version-file
        path: src/loader/

    - name: Cache APT packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-${{ hashFiles('**/install-packages.sh') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Install Packages
      run: scripts/windows/install-packages.sh

    - name: Compile Build for Windows
      id: build
      shell: bash
      run: |
        ./tests/run_aer_driveboard_recorder_tests.sh
        ./tests/run_aer_activation_diagnostics_tests.sh
        ./tests/run_aer_native_activation_tests.sh
        ./tests/run_aer_vehicle_telemetry_tests.sh
        python3 tests/aer_ffb_analyzer_test.py
        ./tests/run_aer_virtual_driveboard_bootstrap_tests.sh
        ./tests/run_aer_virtual_driveboard_infrastructure_tests.sh
        ./tests/run_aer_virtual_driveboard_activation_tests.sh
        ./tests/run_aer_virtual_driveboard_model_tests.sh
        ./tests/run_aer_offline_activation_model_tests.sh
        ./tests/run_aer_virtual_driveboard_bridge_tests.sh
        scripts/windows/windows-build.sh
        echo "artifact_name=LinuxLoader-AER04-FFB-Telemetry-WIN32-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

    - name: Upload AER-04 Windows artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.build.outputs.artifact_name }}
        path: "${{ steps.build.outputs.artifact_name }}.zip"
