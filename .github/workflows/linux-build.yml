name: 🐧 Linux Build

on:
  workflow_call:

jobs:
  linux-appimage:
    name: "Build"
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download version.h artifact
      uses: actions/download-artifact@v4
      with:
        name: version-file
        path: src/loader/

    - name: Cache APT packages
      uses: actions/cache@v4
      with:
        path: /var/cache/apt/archives
        key: ${{ runner.os }}-apt-${{ hashFiles('**/install-packages.sh') }}
        restore-keys: |
          ${{ runner.os }}-apt-

    - name: Install Packages
      run: scripts/appimage/install-packages.sh

    - name: Pack ID Libs
      run: scripts/appimage/id-libs.sh

    - name: Install Kisak
      run: scripts/appimage/install-kisak.sh

    - name: Build Deps
      run: scripts/appimage/build-deps.sh

    - name: Compile Build for Linux
      shell: bash
      run: |
        ./tests/run_aer_driveboard_recorder_tests.sh
        ./tests/run_aer_activation_diagnostics_tests.sh
        ./tests/run_aer_native_activation_tests.sh
        ./tests/run_aer_vehicle_telemetry_tests.sh
        python3 tests/aer_ffb_analyzer_test.py
        ./tests/run_aer_virtual_driveboard_bootstrap_tests.sh
        ./tests/run_aer_virtual_driveboard_infrastructure_tests.sh
        ./tests/run_aer_virtual_driveboard_activation_tests.sh
        ./tests/run_aer_virtual_driveboard_model_tests.sh
        ./tests/run_aer_offline_activation_model_tests.sh
        ./tests/run_aer_virtual_driveboard_bridge_tests.sh
        scripts/linux/make-linux.sh
        scripts/appimage/make-appimage.sh

    - name: Upload linuxloader-linux.tar.gz artifact
      uses: actions/upload-artifact@v4
      with:
        name: "linux-build" 
        path: "linuxloader-linux.tar.gz"

    - name: Upload AppImage
      uses: actions/upload-artifact@v4
      with:
        name: "linux-appimage"
        path: "linuxloader.AppImage"
